name: Build Windows Desktop
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged Windows application
        run: npm run smoke
        env:
          BAOZHANG_PACKAGED: '1'
      - name: Hash packages
        shell: pwsh
        run: |
          # Unsigned build (no Authenticode certificate): publish SHA-256 for both the installer and the ZIP.
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $files = @("release/BaoZhang-Desktop-Setup-$version.exe", "release/BaoZhang-Desktop-$version.zip")
          $lines = foreach ($f in $files) { $i = Get-Item $f; '{0}  {1}' -f (Get-FileHash $i.FullName -Algorithm SHA256).Hash.ToLower(), $i.Name }
          $lines | Set-Content "release/SHA256SUMS-desktop-$version.txt" -Encoding Ascii
          $lines
      - uses: actions/upload-artifact@v4
        with:
          name: BaoZhang-Windows
          path: |
            desktop/release/BaoZhang-Desktop-Setup-*.exe
            desktop/release/BaoZhang-Desktop-*.zip
            desktop/release/SHA256SUMS-desktop-*.txt
            desktop/verification/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-diagnostics
          path: desktop/verification/
          retention-days: 14
